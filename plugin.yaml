name: hermis
version: 0.1.0
description: "H.E.R.M.I.S turns your Windows desktop into an agent OS: Hermes draws floating data surfaces over your real desktop (the agent sends data, not HTML) and manages your real windows. Starts a background daemon thread binding a loopback WebSocket server on 127.0.0.1 (ephemeral port + session token), and injects active screen/surface context via pre_llm_call. When Autopilot turns on (or on the first draw with no overlay connected) it launches the bundled Electron overlay in the background via npm (first run installs npm dependencies over the network); disable with HERMIS_OVERLAY_AUTOSTART=0. Session and surface state metadata (overlay.json, state.json, overlay.log) is written to plugin_data_dir."
author: "gabogabucho"
kind: standalone
python_dependencies:
  - "websockets>=15,<16"
provides_tools:
  - autopilot
  - render_surface
  - close_surface
  - list_surfaces
  - layout_windows
  - launch_app
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - post_llm_call
