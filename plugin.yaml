name: hermis
version: 0.1.0
description: "H.E.R.M.I.S turns your Windows desktop into an agent OS: Hermes draws floating data surfaces over your real desktop (the agent sends data, not HTML) and manages your real windows. Moves, resizes and focuses real Windows windows via Win32 (user32) with layout_windows, and opens applications with launch_app. Registers the /hermis slash command (status | on | off | check | setup); the setup checklist reads Hermes config.yaml read-only, checks API keys only for presence in the environment (never their values or .env), and its Copy buttons write the shown command to the clipboard without running it. With Autopilot Mode active, copies the HTML/SVG artifacts (```html / ```svg blocks) from Hermes' replies to the overlay as isolated artifact surfaces via post_llm_call. Starts a background daemon thread binding a loopback WebSocket server on 127.0.0.1 (ephemeral port + session token), and injects active screen/surface context via pre_llm_call. When Autopilot turns on (or on the first draw with no overlay connected) it launches the bundled Electron overlay in the background via npm (first run installs npm dependencies over the network); disable with HERMIS_OVERLAY_AUTOSTART=0. The overlay may load https images, and sandboxed artifact surfaces may load scripts only from cdnjs.cloudflare.com, cdn.jsdelivr.net and unpkg.com; links open in the default browser on click. The overlay connects to the local Hermes gateway (control named pipe / gateway.sock for a short-lived session ticket under the user's identity, then the loopback gateway WebSocket /api/ws) and only listens to voice.status and wake.detected to animate the orb. Session and surface state metadata (overlay.json, state.json, overlay.log) is written to plugin_data_dir."
author: "gabogabucho"
kind: standalone
python_dependencies:
  - "websockets>=15,<16"
provides_tools:
  - autopilot
  - render_surface
  - close_surface
  - list_surfaces
  - layout_windows
  - launch_app
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - post_llm_call
