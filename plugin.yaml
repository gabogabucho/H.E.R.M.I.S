name: hermis
version: 0.1.0
description: "H.E.R.M.I.S turns your Windows desktop into an agent OS: Hermes draws floating data surfaces over your real desktop (the agent sends data, not HTML) and manages your real windows. Starts a background daemon thread binding a loopback WebSocket server on 127.0.0.1 (ephemeral port + session token), writes session connection and surface state metadata (overlay.json, state.json) to plugin_data_dir, and injects active screen/surface context via pre_llm_call."
author: "gabogabucho"
kind: standalone
python_dependencies:
  - "websockets>=15,<16"
provides_tools:
  - autopilot
  - render_surface
  - close_surface
  - list_surfaces
provides_hooks:
  - pre_llm_call
