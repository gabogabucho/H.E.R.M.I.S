name: hermis
version: 0.1.0
description: "H.E.R.M.I.S turns your Windows desktop into an agent OS: Hermes draws floating data surfaces over your real desktop (the agent sends data, not HTML) and manages your real windows. Starts a background daemon thread binding a loopback WebSocket server on 127.0.0.1 (ephemeral port + session token) and writes session connection metadata (overlay.json) to plugin_data_dir."
author: "gabogabucho"
kind: standalone
python_dependencies:
  - "websockets>=15,<16"
provides_tools:
  - render_surface
